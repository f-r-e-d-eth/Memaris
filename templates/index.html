<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memaris</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="background"></div><div class="shade"></div>
  <main class="app">
    <section class="workspace">
      <aside class="panel sidebar">
        <div class="sidebar-head">
          <div><h1>Memaris</h1><span>Capture today. Find tomorrow.</span></div>
          <button id="newButton">＋ New</button>
        </div>
        <div id="entries"></div>
      </aside>
      <section class="panel editor">
        <div class="date-row">
          <button id="dateDisplay" title="Click to change date display format"></button>
          <button id="editDateButton" title="Change timeline date and time">✎</button>
          <button id="recurrenceButton" title="Recurrence: Off">↻ Off</button>
          <input id="eventTime" type="datetime-local" aria-label="Timeline date and time">
        </div>
        <textarea id="entryText" placeholder="What's on your mind?"></textarea>
        <div class="editor-footer">
          <span id="status">New entry</span>
          <div class="editor-controls">
            <button id="backgroundButton" title="Next background">◐</button>
            <label title="Text color"><input id="colorPicker" type="color" value="#ffffff"></label>
            <label title="Text size">A <input id="fontSlider" type="range" min="14" max="40" value="22"></label>
            <label title="Glass transparency">◇ <input id="opacitySlider" type="range" min="20" max="95" value="72"></label>
            <button id="saveButton">Save</button>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
